<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在连接在线客服...</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
      box-sizing: border-box;
      color: #333;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 360px;
      padding: 36px 24px;
      border-radius: 18px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 20px;
      border: 4px solid #e6f7ed;
      border-top: 4px solid #07c160;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 {
      font-size: 18px;
      margin: 0 0 10px;
      color: #111;
    }
    p {
      font-size: 13.5px;
      color: #666;
      line-height: 1.6;
      margin: 0 0 22px;
    }
    .manual-btn {
      display: inline-block;
      padding: 10px 22px;
      background-color: #07c160;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>正在为您连接人工客服...</h2>
    <p>系统正在分配专属客服通道，一般需要 2～4 秒<br>请稍候，切勿关闭当前页面</p>
    <a href="https://tawk.to/chat/6b02638e6bbbe33cde602384/1k80l9q6k" class="manual-btn">如长时间未进入，点此立即进入</a>
  </div>

  <script>
    // 停留 0.6 秒确保过渡动画渲染出来后再发起跳转，跳转期间浏览器会一直保留当前提示页直到新页面响应
    setTimeout(function() {
      window.location.replace("https://tawk.to/chat/6b02638e6bbbe33cde602384/1k80l9q6k");
    }, 600);
  </script>
</body>
</html>
