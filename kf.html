<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>正在连接在线客服...</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f5f7;
    }

    /* 底层全屏客服窗口 */
    #chatFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }

    /* 顶层防白屏过渡遮罩 */
    #loadingMask {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #f4f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 370px;
      padding: 36px 24px 28px;
      border-radius: 18px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 20px;
      border: 4px solid #e6f7ed;
      border-top: 4px solid #07c160;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 {
      font-size: 18px;
      margin: 0 0 10px;
      color: #111;
    }
    p {
      font-size: 13.5px;
      color: #666;
      line-height: 1.65;
      margin: 0 0 18px;
    }
    .timer-badge {
      display: inline-block;
      background: #f0fdf4;
      color: #059648;
      border: 1px solid #bbf7d0;
      font-size: 13px;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    .manual-btn {
      display: inline-block;
      padding: 11px 22px;
      background-color: #07c160;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    .net-tip {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px dashed #eee;
      font-size: 12px;
      color: #888;
      line-height: 1.6;
      text-align: left;
    }
    .net-tip b {
      color: #555;
    }
  </style>
</head>
<body>

  <!-- 底层直接静默加载经典聊天页 -->
  <iframe id="chatFrame" src="https://tawk.to/chat/6b02638e6bbbe33cde602384/1k80l9q6k" allow="microphone; camera; clipboard-write"></iframe>

  <!-- 顶层提示遮罩 -->
  <div id="loadingMask">
    <div class="card">
      <div class="spinner"></div>
      <h2>正在为您连接人工客服...</h2>
      <p>首次接入海外专线通道约需 <b>5～15 秒</b><br>系统正在分配客服坐席，请耐心稍候</p>
      <div class="timer-badge" id="waitTimer">已安全连接中：1 秒...</div>
      <br>
      <button class="manual-btn" onclick="revealChat()">如已加载完成，点此立即进入</button>
      
      <div class="net-tip">
        💡 <b>网络小贴士：</b>如开着加速器长时间转圈无法进入，可能是当前节点拥堵，尝试切换<b>香港/新加坡/日本等亚太节点</b>即可秒开；急事也可直接加备用QQ群：<b>716752493</b>
      </div>
    </div>
  </div>

  <script>
    var sec = 1;
    var maskClosed = false;
    var timerEl = document.getElementById('waitTimer');
    var maskEl = document.getElementById('loadingMask');
    var frameEl = document.getElementById('chatFrame');

    function revealChat() {
      if (maskClosed) return;
      maskClosed = true;
      document.title = '官方在线客服 - 海外账号批发';
      maskEl.style.opacity = '0';
      setTimeout(function() {
        maskEl.style.display = 'none';
      }, 350);
    }

    setInterval(function() {
      if (maskClosed) return;
      sec++;
      if (sec <= 15) {
        timerEl.innerText = '已安全连接中：' + sec + ' 秒...';
      } else {
        timerEl.innerText = '当前节点较慢，正在努力接入（' + sec + ' 秒）...';
      }
    }, 1000);

    // 底层 HTML 响应后多留 5 秒给内部 JS 彻底画完对话框，实现零白屏切换
    frameEl.onload = function() {
      setTimeout(revealChat, 5000);
    };

    setTimeout(revealChat, 15000);
  </script>

</body>
</html>
