<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海外账号批发-官方导航</title>
    <style>
        /* 基础背景与字体设置 */
        body {
            background-color: #f4f5f7;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow-x: hidden;
        }

        /* 主容器 */
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        /* 顶部头像样式 */
        .avatar {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1890ff, #0050b3);
            box-shadow: 0 4px 15px rgba(24, 144, 255, 0.3);
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .avatar-icon {
            font-size: 42px;
        }

        /* 标题与描述文本 */
        h1 {
            font-size: 18px;
            color: #000;
            margin: 0 0 10px;
            font-weight: bold;
        }

        .desc {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-line;
        }

        /* 必看重点提示 */
        .highlight-text {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* 按钮列表容器 */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 每一个按钮的基础样式 */
        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #333;
            font-size: 15px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
            cursor: pointer;
            box-sizing: border-box;
        }

        .link-item:active {
            transform: scale(0.98);
            background-color: #f9f9f9;
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .link-icon {
            font-size: 22px;
        }

        .arrow {
            color: #ccc;
            font-weight: bold;
        }

        /* ================= 在线客服专属强调动效 ================= */
        .link-item-wx {
            background: linear-gradient(135deg, #07c160, #059648);
            color: #ffffff !important;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(7, 193, 96, 0.35);
            animation: pulse-wx 2.2s infinite ease-in-out;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .link-item-wx .arrow {
            color: rgba(255, 255, 255, 0.85);
        }

        .link-item-wx:active {
            background: linear-gradient(135deg, #06ad56, #04823e) !important;
        }

        @keyframes pulse-wx {
            0% {
                transform: scale(1);
                box-shadow: 0 4px 15px rgba(7, 193, 96, 0.35);
            }
            50% {
                transform: scale(1.02);
                box-shadow: 0 6px 22px rgba(7, 193, 96, 0.6);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 4px 15px rgba(7, 193, 96, 0.35);
            }
        }

        .link-item-wx::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -60%;
            width: 40%;
            height: 200%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(25deg);
            animation: shine-sweep 3.5s infinite;
        }

        @keyframes shine-sweep {
            0% { left: -60%; }
            30% { left: 140%; }
            100% { left: 140%; }
        }

        /* ================= 1. 强制倒计时警示弹窗 ================= */
        #warningModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(8px);
            z-index: 2147483647;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-card {
            background: #ffffff;
            width: 100%;
            max-width: 430px;
            border-radius: 18px;
            padding: 26px 22px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            text-align: center;
            animation: modalPop 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        @keyframes modalPop {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-header-icon {
            font-size: 42px;
            margin-bottom: 6px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            color: #d32f2f;
            margin-bottom: 14px;
            letter-spacing: 0.5px;
        }

        .modal-body {
            font-size: 14.5px;
            line-height: 1.7;
            color: #2b2b2b;
            background: #fff8f8;
            border: 1px solid #ffcdd2;
            padding: 16px;
            border-radius: 12px;
            text-align: left;
            margin-bottom: 20px;
        }

        .modal-body b {
            color: #d32f2f;
        }

        .confirm-btn {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            background-color: #e0e0e0;
            color: #888888;
            cursor: not-allowed;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .confirm-btn.active {
            background-color: #1976d2;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(25, 118, 210, 0.45);
        }

        /* ================= 2. 独立稳定的 QQ 弹窗样式 ================= */
        #qqModalWrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(5px);
            z-index: 2147483646;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .qq-modal-card {
            background: #ffffff;
            width: 100%;
            max-width: 320px;
            border-radius: 16px;
            padding: 24px 20px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
            animation: modalPop 0.25s ease;
        }

        .qq-close-x {
            position: absolute;
            top: 12px;
            right: 14px;
            font-size: 20px;
            color: #999;
            cursor: pointer;
            line-height: 1;
            padding: 4px;
        }

        .qq-box {
            background: #f1f5f9;
            border-radius: 10px;
            padding: 14px;
            margin: 16px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qq-number {
            font-size: 22px;
            font-weight: 800;
            color: #1976d2;
            letter-spacing: 1.5px;
            user-select: all;
        }

        .copy-btn {
            width: 100%;
            background: #1976d2;
            color: #fff;
            border: none;
            padding: 12px 0;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
