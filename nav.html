<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海外账号批发-官方导航</title>
    <style>
        /* 基础背景与字体设置 */
        body {
            background-color: #f4f5f7;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow-x: hidden;
        }

        /* 主容器 */
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        /* 顶部头像样式（纯CSS渐变图标，杜绝外链失效碎图） */
        .avatar {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1890ff, #0050b3);
            box-shadow: 0 4px 15px rgba(24, 144, 255, 0.3);
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .avatar-icon {
            font-size: 42px;
        }

        /* 标题与描述文本 */
        h1 {
            font-size: 18px;
            color: #000;
            margin: 0 0 10px;
            font-weight: bold;
        }

        .desc {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-line;
        }

        /* 必看重点提示 */
        .highlight-text {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* 按钮列表容器 */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 每一个按钮的样式 */
        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #333;
            font-size: 15px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
        }

        .link-item:active {
            transform: scale(0.98);
            background-color: #f9f9f9;
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .link-icon {
            font-size: 22px;
        }

        .arrow {
            color: #ccc;
            font-weight: bold;
        }

        /* ================= 强制倒计时警示弹窗样式 ================= */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(8px);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-card {
            background: #ffffff;
            width: 100%;
            max-width: 430px;
            border-radius: 18px;
            padding: 26px 22px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            text-align: center;
            animation: modalPop 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        @keyframes modalPop {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-header-icon {
            font-size: 42px;
            margin-bottom: 6px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            color: #d32f2f;
            margin-bottom: 14px;
            letter-spacing: 0.5px;
        }

        .modal-body {
            font-size: 14.5px;
            line-height: 1.7;
            color: #2b2b2b;
            background: #fff8f8;
            border: 1px solid #ffcdd2;
            padding: 16px;
            border-radius: 12px;
            text-align: left;
            margin-bottom: 20px;
        }

        .modal-body b {
            color: #d32f2f;
        }

        /* 倒计时确认按钮 */
        .confirm-btn {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            background-color: #e0e0e0;
            color: #888888;
            cursor: not-allowed;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        /* 倒计时结束后的高亮激活状态 */
        .confirm-btn.active {
            background-color: #1976d2;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(25, 118, 210, 0.45);
            animation: pulse-btn 1.5s infinite;
        }

        @keyframes pulse-btn {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>

    <!-- 百度统计探针 -->

</head>
<body>

    <!-- 1. 强制阅读倒计时弹窗 -->
    <div id="warningModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header-icon">⚠️</div>
            <div class="modal-title">平台安全合规重要提示</div>
            <div class="modal-body">
                电商平台<b>不回复任何海外注册购买账号等敏感话题，会封号！</b>你要的我们都有，咨询下单直接联系微信客服，<b>不要再返回电商平台，电商客服不回复任何咨询消息！</b>
            </div>

            <button id="submitBtn" class="confirm-btn" disabled>请仔细阅读重要提示 (10s)</button>
        </div>
    </div>

    <!-- 2. 主导航内容容器 -->
    <div class="container">
        <!-- 头像区（纯净地球图标） -->
        <div class="avatar">
            <span class="avatar-icon">🌐</span>
        </div>

        <!-- 标题与介绍 -->
        <h1>海外账号批发</h1>
        <div class="desc">Tg飞机/电报成品号，+86号码登录问题
x推特号 谷歌Google号 Tiktok
苹果ID ins facebook gpt whatsapp
网络代理（梯子、加速器、VPN）等等</div>

        <div class="highlight-text">必看重点！！！人工发货与自动发货的产品业务不一样，你要的都有！请按需求选购</div>

        <!-- 核心跳转按钮区 -->
        <div class="links-container">
            <!-- 按钮1: 人工发货区 -->
            <a href="https://docs.qq.com/doc/DY29hbVROSGR2Z09q" target="_blank" class="link-item">
                <div class="link-left">
                    <span class="link-icon">⏩</span>
                    <span>人工发货区</span>
                </div>
                <span class="arrow">&gt;</span>
            </a>

            <!-- 按钮2: 24小时自动发货区 -->
            <a href="https://tgsss.com/CD70AD47" target="_blank" class="link-item">
                <div class="link-left">
                    <span class="link-icon">👉</span>
                    <span>24小时自动发货区</span>
                </div>
                <span class="arrow">&gt;</span>
            </a>

            <!-- 按钮3: 客服微信 -->
            <a href="wx.html" target="_blank" class="link-item">
                <div class="link-left">
                    <span class="link-icon">💬</span>
                    <span>客服微信</span>
                </div>
                <span class="arrow">&gt;</span>
            </a>

            <!-- 按钮4: 备用Q群 -->
            <a href="https://qm.qq.com/q/HZrOZa3mYQ" target="_blank" class="link-item">
                <div class="link-left">
                    <span class="link-icon">🐧</span>
                    <span>备用Q群</span>
                </div>
                <span class="arrow">&gt;</span>
            </a>
        </div>
    </div>

    <!-- 3. 倒计时解锁逻辑脚本 -->
    <script>
        let countdown = 10; // 设定强制阅读秒数
        const submitBtn = document.getElementById('submitBtn');
        const modal = document.getElementById('warningModal');

        // 启动定时器
        const timer = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                submitBtn.innerText = `请仔细阅读重要提示 (${countdown}s)`;
            } else {
                clearInterval(timer);
                submitBtn.disabled = false;
                submitBtn.classList.add('active');
                submitBtn.innerText = '我已知晓并同意，确认进入';
            }
        }, 1000);

        // 点击确认进入
        submitBtn.addEventListener('click', function() {
            if (!this.disabled) {
                modal.style.opacity = '0';
                setTimeout(() => {
                    modal.style.display = 'none';
                }, 300);
            }
        });
    </script>
</body>
</html>
