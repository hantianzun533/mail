    <title>海外账号批发-官方导航</title>
    <style>
        /* 基础背景与字体设置 */
        body {
            background-color: #f4f5f7;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow-x: hidden;
        }

        /* 主容器 */
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        /* 顶部头像样式（纯CSS渐变图标） */
        .avatar {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1890ff, #0050b3);
            box-shadow: 0 4px 15px rgba(24, 144, 255, 0.3);
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .avatar-icon {
            font-size: 42px;
        }

        /* 标题与描述文本 */
        h1 {
            font-size: 18px;
            color: #000;
            margin: 0 0 10px;
            font-weight: bold;
        }

        .desc {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-line;
        }

        /* 必看重点提示 */
        .highlight-text {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* 按钮列表容器 */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 每一个按钮的样式 */
        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #333;
            font-size: 15px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
        }

        .link-item:active {
            transform: scale(0.98);
            background-color: #f9f9f9;
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .link-icon {
            font-size: 22px;
        }

        .arrow {
            color: #ccc;
            font-weight: bold;
        }
    </style>
